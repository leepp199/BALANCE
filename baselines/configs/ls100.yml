# LS-100 (LibriSpeech 100 speakers) configuration
dataset: librispeech
dataroot: /data/datasets/librispeech_fscil/
num_base: 80
num_novel: 20
way: 5
n_shot: 5
pretrained_model: /data/lqq/baseline/save/base_train_for_meta_ls.pth

# Audio feature extraction
sample_rate: 16000
n_fft: 400
hop_size: 160
mel_bins: 128

# Evaluation
batch_size: 128
test_batch_size: 100

# OSR
osr_calib_pct: 0.95
temperature: 10.0
