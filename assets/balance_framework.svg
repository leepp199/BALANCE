<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="760" viewBox="0 0 2400 760">
  <defs>
    <linearGradient id="softBlue" x1="0" x2="1"><stop stop-color="#eef6fb"/><stop offset="1" stop-color="#f8fbfd"/></linearGradient>
    <linearGradient id="softGold" x1="0" x2="1"><stop stop-color="#fff7e6"/><stop offset="1" stop-color="#fffbf4"/></linearGradient>
    <linearGradient id="softViolet" x1="0" x2="1"><stop stop-color="#f5f0f8"/><stop offset="1" stop-color="#fbf9fc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1677a8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3f7f45"/>
    </marker>
    <style>
      .phaseTitle{font:700 38px 'Arial','Helvetica',sans-serif;fill:#102a43;dominant-baseline:middle}
      .nodeText{font:600 31px 'Arial','Helvetica',sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}
      .smallMath{font:italic 30px 'Times New Roman',serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}
      .node{fill:#fff;stroke:#7b8da4;stroke-width:2.5;rx:18;filter:url(#shadow)}
      .blue{fill:#e8f3f8;stroke:#277da1;stroke-width:2.8;rx:18;filter:url(#shadow)}
      .gold{fill:#fff1cf;stroke:#d99a1b;stroke-width:2.8;rx:18;filter:url(#shadow)}
      .green{fill:#e9f4e4;stroke:#5b8f55;stroke-width:2.8;rx:18;filter:url(#shadow)}
      .violet{fill:#f1ebf5;stroke:#80649a;stroke-width:2.8;rx:18;filter:url(#shadow)}
      .edge{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .reuseBlue{fill:none;stroke:#1677a8;stroke-width:4;stroke-dasharray:13 10;stroke-linecap:round;marker-end:url(#arrowBlue)}
      .reuseGold{fill:none;stroke:#d97706;stroke-width:4;stroke-dasharray:13 10;stroke-linecap:round;marker-end:url(#arrowGold)}
      .known{fill:none;stroke:#3f7f45;stroke-width:4;stroke-linecap:round;marker-end:url(#arrowGreen)}
      .rejected{fill:none;stroke:#c84b3f;stroke-width:4;stroke-linecap:round;marker-end:url(#arrowGold)}
    </style>
  </defs>

  <rect width="2400" height="760" fill="#ffffff"/>
  <rect x="24" y="22" width="654" height="62" rx="31" fill="#dceef7"/>
  <circle cx="66" cy="53" r="25" fill="#1677a8"/>
  <text x="66" y="55" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">1</text>
  <text class="phaseTitle" x="108" y="54">Uncertainty Curriculum + LSRB</text>

  <rect x="718" y="22" width="654" height="62" rx="31" fill="#fff0cc"/>
  <circle cx="760" cy="53" r="25" fill="#d99a1b"/>
  <text x="760" y="55" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">2</text>
  <text class="phaseTitle" x="802" y="54">Class-Conditional Boundary</text>

  <rect x="1412" y="22" width="964" height="62" rx="31" fill="#eee6f3"/>
  <circle cx="1454" cy="53" r="25" fill="#80649a"/>
  <text x="1454" y="55" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">3</text>
  <text class="phaseTitle" x="1496" y="54">Online Open-World Session</text>

  <rect x="24" y="106" width="654" height="620" rx="24" fill="url(#softBlue)"/>
  <rect x="718" y="106" width="654" height="620" rx="24" fill="url(#softGold)"/>
  <rect x="1412" y="106" width="964" height="620" rx="24" fill="url(#softViolet)"/>

  <!-- Phase 1: one encoder, two highlighted learning paths -->
  <rect class="node" x="54" y="244" width="128" height="126"/>
  <path d="M72 309C82 267 91 353 101 296S120 347 130 286S149 339 165 306" fill="none" stroke="#172033" stroke-width="6"/>
  <text class="nodeText" x="118" y="218">Audio</text>
  <rect class="blue" x="230" y="252" width="172" height="108"/>
  <text class="nodeText" x="316" y="307">Encoder E₀</text>
  <path class="edge" d="M182 307H230"/>

  <rect class="gold" x="452" y="156" width="190" height="88"/>
  <text class="nodeText" x="547" y="201">Uncertainty</text>
  <path class="edge" d="M402 280H427V200H452"/>
  <circle cx="475" cy="298" r="22" fill="#87b86d"/>
  <circle cx="547" cy="298" r="26" fill="#efc24d"/>
  <circle cx="624" cy="298" r="31" fill="#df6357"/>
  <path d="M497 298H518M573 298H593" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect class="blue" x="452" y="398" width="190" height="100"/>
  <text class="nodeText" x="547" y="449">LSRB</text>
  <g fill="#167f86"><circle cx="494" cy="474" r="9"/><circle cx="520" cy="474" r="9"/><circle cx="546" cy="474" r="9"/><circle cx="572" cy="474" r="9"/><circle cx="598" cy="474" r="9"/></g>
  <path class="edge" d="M402 334H426V448H452"/>
  <rect class="node" x="430" y="548" width="105" height="70"/>
  <text class="nodeText" x="482" y="584">E₀</text>
  <rect class="node" x="548" y="548" width="105" height="70"/>
  <text class="smallMath" x="600" y="584">W₀</text>
  <path class="edge" d="M316 360V520H482V548"/>
  <path class="edge" d="M316 520H600V548"/>

  <!-- Phase 2: episode to paired prototypes to learned gate -->
  <rect class="node" x="752" y="145" width="166" height="86"/>
  <text class="smallMath" x="835" y="188">Support S</text>
  <rect class="node" x="956" y="145" width="166" height="86"/>
  <text class="smallMath" x="1039" y="188">Known Qₖ</text>
  <rect class="violet" x="1160" y="145" width="178" height="86"/>
  <text class="smallMath" x="1249" y="188">Pseudo Qᵤ</text>

  <rect class="node" x="770" y="304" width="218" height="92"/>
  <text class="smallMath" x="879" y="350">Positive P⁺</text>
  <g><circle cx="815" cy="375" r="12" fill="#e34a42"/><rect x="850" y="363" width="24" height="24" fill="#3b82c4"/><path d="M911 362L925 386H897Z" fill="#7fb24d"/></g>
  <rect class="blue" x="1048" y="282" width="254" height="82"/>
  <text class="nodeText" x="1175" y="323">Boundary ψ</text>
  <rect class="gold" x="1048" y="420" width="254" height="92"/>
  <text class="smallMath" x="1175" y="466">Companions P⁻</text>
  <g opacity="0.58"><circle cx="1101" cy="490" r="12" fill="#e34a42"/><rect x="1140" y="478" width="24" height="24" fill="#3b82c4"/><path d="M1207 477L1221 501H1193Z" fill="#7fb24d"/></g>
  <path class="edge" d="M835 231V274H879V304"/>
  <path class="edge" d="M988 350H1018V323H1048"/>
  <path class="edge" d="M1175 364V420"/>

  <rect class="gold" x="810" y="570" width="250" height="82"/>
  <text class="nodeText" x="935" y="611">Margin Loss</text>
  <path class="edge" d="M879 396V540H910V570"/>
  <path class="edge" d="M1175 512V540H960V570"/>
  <path d="M1039 231V258H1249V231" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M1144 258H1344V540H1035V570"/>
  <polygon points="1248,556 1332,611 1248,666 1164,611" fill="#e8f3f8" stroke="#277da1" stroke-width="3" filter="url(#shadow)"/>
  <text class="nodeText" x="1248" y="611">Gate τ</text>
  <path class="edge" d="M1060 611H1164"/>

  <!-- Phase 3: clean online loop -->
  <rect class="node" x="1450" y="152" width="184" height="92"/>
  <path d="M1470 198C1481 158 1490 235 1500 180S1519 230 1529 170S1548 226 1612 196" fill="none" stroke="#172033" stroke-width="6"/>
  <text class="nodeText" x="1542" y="128">Mixed Stream</text>
  <rect class="blue" x="1680" y="152" width="180" height="92"/>
  <text class="nodeText" x="1770" y="198">Frozen E₀</text>
  <polygon points="1995,143 2080,198 1995,253 1910,198" fill="#e8f3f8" stroke="#277da1" stroke-width="3" filter="url(#shadow)"/>
  <text class="nodeText" x="1995" y="198">Gate τ</text>
  <path class="edge" d="M1634 198H1680"/>
  <path class="edge" d="M1860 198H1910"/>

  <rect class="green" x="2160" y="152" width="174" height="92"/>
  <text class="nodeText" x="2247" y="198">Known</text>
  <path class="known" d="M2080 198H2160"/>

  <rect class="blue" x="1840" y="332" width="310" height="96"/>
  <text class="nodeText" x="1995" y="380">Semantic + LSRB</text>
  <path class="rejected" d="M1995 253V332"/>
  <rect class="gold" x="1840" y="490" width="310" height="88"/>
  <text class="smallMath" x="1995" y="534">Standard Kₜ-means</text>
  <path class="edge" d="M1995 428V490"/>

  <rect class="violet" x="1448" y="624" width="200" height="78"/>
  <text class="nodeText" x="1548" y="663">5-shot</text>
  <rect class="green" x="1700" y="624" width="210" height="78"/>
  <text class="nodeText" x="1805" y="663">Mean Prototype</text>
  <rect class="blue" x="1962" y="624" width="250" height="78"/>
  <text class="smallMath" x="2087" y="663">Expand Cₜ</text>
  <path class="edge" d="M1995 578V600H1548V624"/>
  <path class="edge" d="M1648 663H1700"/>
  <path class="edge" d="M1910 663H1962"/>
  <path class="edge" d="M2212 663H2315V290H2247V244"/>

  <!-- Learned components reused online; routed outside content -->
  <path class="reuseBlue" d="M642 448H690V716H1810V380H1840"/>
  <path class="reuseGold" d="M1332 611H1390V108H1995V143"/>
</svg>
