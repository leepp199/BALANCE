# Baseline evaluation config for FSC-89 (FMC dataset)
# Usage:
#   python -m scripts.run_all_baselines --config configs/baseline_eval_fsc89.yml \
#       --pretrained_dir save/ [other args]

train:
  way: 5
  shot: 5
  num_session: 5
  num_base: 69
  num_novel: 20
  num_all: 89
  start_session: 1
  test_times: 50
  seq_sample: false
  tmp_train: true
  feat_dim: 512
  save_dir: /data/lqq/baseline/save/
  seed: 3420
  n_ways: 5
  n_open_ways: 5
  n_shots: 5
  n_queries: 15
  n_test_runs: 300
  n_train_runs: 300
  train_classes: 69
  epochs:
    epochs_std: 30
    epochs_meta: 15
    epochs_stdu_base: 1
    epochs_new: 5
  lr:
    lr_std: 0.005
    lr_stdu_base: 0.0002
    lrg: 0.1
    lr_new: 0.1
    lr_decay_rate: 0.1
    lr_decay_epochs: "20 50 100"
  scheduler:
    schedule: Step
    milestones: [40, 80]
    step: 40
    gamma: 0.5
  optimizer:
    decay: 0.0005
    momentum: 0.9
  network:
    temperature: 1
    base_mode: ft_cos
    new_mode: ft_cos
  strategy:
    data_init: true
    set_no_val: false
    seq_sample: false
  episode:
    train_episode: 50
    episode_way: 5
    episode_shot: 5
    episode_query: 15
    low_way: 5
    low_shot: 5
  dataloader:
    num_workers: 0
    train_batch_size: 128
    test_batch_size: 100
  stdu:
    num_tmpb: 44
    num_tmpi: 20
    num_tmps: 14
    num_incre: 5
    pqa: false
    ap:
      use_ap: true
      ap_type: outer
      ap_on_test: false
    anchor:
      use_anchor: false
      anchor_type: base_anchor
    proto:
      weighted: false
      type: mmt
  extractor:
    sample_rate: 16000
    window_size: 400
    hop_size: 160
    mel_bins: 128
    fmin: 0
    fmax: 8000
    window: hann

  # Dataset fields
  dataset: FMC
  dataroot: /data/datasets/FSD-MIX-CLIPS-for_FSCIL/FSD-MIX-CLIPS_data
  train_weight_base: 1
  base_seman_calib: 1
  neg_gen_type: att
  agg: avg
  num_labeled_classes: 69
  num_unlabeled_classes: 5
